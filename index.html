<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KevZen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: calme, tendre, contemplatif, presque silencieux
   IDEA: un karesansui vu du ciel ; le sable ratissé est la toile et l'instrument
   PICTURE: le jardin lui-même, bord à bord : sable en relief, pierres moussues, pétales qui dérivent
   COLOUR and TYPE: la lumière du moment (aube, midi, crépuscule, nuit) ; Shippori Mincho + Zen Kaku Gothic New
   LAYOUT: jardin plein écran, nom discret en haut, une barre de verre en bas */
:root{color-scheme:dark;--ink:#f7f1e8;--glass:rgba(24,20,18,.42);--line:rgba(255,255,255,.16);--acc:#f3c6a8}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1714;color:var(--ink);font:16px/1.5 "Zen Kaku Gothic New",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#g{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:none}
.top{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));max-width:calc(100vw - 28px);display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;padding:10px 18px 11px;border-radius:22px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);pointer-events:none;transition:opacity .8s}
.mark{font:700 24px/1 "Shippori Mincho",serif;text-shadow:0 1px 14px rgba(0,0,0,.35)}
.hint{font-size:14px;opacity:.9;text-shadow:0 1px 8px rgba(0,0,0,.55);transition:opacity .5s}
.bar{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding:7px;border-radius:28px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line);box-shadow:0 14px 44px rgba(0,0,0,.3);transition:opacity .6s;width:max-content;max-width:calc(100vw - 20px)}
.grp{display:flex;gap:3px;align-items:center}
.sep{width:1px;height:28px;background:var(--line);margin:0 3px}
button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;border-radius:22px;min-height:44px;min-width:44px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:background .25s,color .25s,transform .2s;white-space:nowrap}
button:hover{background:rgba(255,255,255,.09)}
button:active{transform:scale(.95)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[aria-pressed=true]{background:rgba(255,248,240,.92);color:#231d19}
button svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sw{padding:0;width:44px}
.sw i{width:24px;height:24px;border-radius:50%;display:block;border:2px solid rgba(255,255,255,.45);box-shadow:inset 0 -5px 9px rgba(0,0,0,.28);transition:transform .25s,border-color .25s}
.sw[aria-pressed=true]{background:rgba(255,255,255,.14)}
.sw[aria-pressed=true] i{border-color:#fff;transform:scale(1.12)}
.quiet .bar{opacity:.16}.quiet .top{opacity:.3}
.intro{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(30,18,22,.42),rgba(30,18,22,.18) 70%,rgba(20,12,14,.55));transition:opacity 1.6s ease;z-index:5}
.intro h1{font:700 clamp(68px,15vw,156px)/1 "Shippori Mincho",serif;margin:0;text-shadow:0 6px 50px rgba(0,0,0,.35)}
.intro p{max-width:32ch;margin:14px auto 30px;font-size:17px;text-shadow:0 1px 12px rgba(0,0,0,.6);text-wrap:balance}
.go{background:rgba(255,250,244,.94);color:#231d19;padding:0 28px;min-height:54px;border-radius:27px;font-size:16px;font-weight:500;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.go:hover{background:#fff}
.intro small{display:block;margin-top:18px;font-size:13px;opacity:.75}
.intro.gone{opacity:0;pointer-events:none}
.pre .bar,.pre .top{opacity:0;pointer-events:none}
@media(max-width:820px){.lbl{display:none}button{padding:0 10px}}
@media(max-width:600px){.bar{gap:2px 6px;padding:5px;border-radius:24px}.sep{display:none}.grp{gap:0}button{min-width:40px;padding:0 8px}.sw{width:40px}.mark{font-size:20px}.hint{font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="pre">
<canvas id="g" aria-label="Jardin de sable"></canvas>
<div class="top"><span class="mark">KevZen</span><span class="hint" id="hint">Glissez pour ratisser le sable</span></div>
<div class="bar" id="bar">
  <div class="grp" role="group" aria-label="Outils">
    <button id="t-rake" data-tool="rake" aria-pressed="true" title="Râteau (1)"><svg viewBox="0 0 24 24"><path d="M12 3v11M5 14h14M6 14v5M10 14v5M14 14v5M18 14v5"/></svg><span class="lbl">Râteau</span></button>
    <button id="t-stone" data-tool="stone" aria-pressed="false" title="Pierre (2)"><svg viewBox="0 0 24 24"><path d="M4 15c0-4 4-7.5 8.5-7.5S20 10 20 14s-4 5-8 5-8-1-8-4z"/><path d="M8.5 11.5c1-1 2.5-1.6 4-1.6"/></svg><span class="lbl">Pierre</span></button>
    <button id="t-smooth" data-tool="smooth" aria-pressed="false" title="Lisser (3)"><svg viewBox="0 0 24 24"><path d="M4 18h16M6 14c3-6 9-6 12 0"/></svg><span class="lbl">Lisser</span></button>
    <button id="tines" title="Largeur du râteau"><svg viewBox="0 0 24 24"><path id="tic" d="M7 6v12M12 6v12M17 6v12"/></svg><span class="lbl" id="tinesL">Moyen</span></button>
  </div>
  <span class="sep"></span>
  <div class="grp" role="group" aria-label="Lumière" id="moods"></div>
  <span class="sep"></span>
  <div class="grp" role="group" aria-label="Actions">
    <button id="undo" title="Annuler (Z)"><svg viewBox="0 0 24 24"><path d="M9 6 4 11l5 5M4 11h10a5.5 5.5 0 0 1 0 11h-3"/></svg><span class="lbl">Annuler</span></button>
    <button id="new" title="Nouveau jardin (N)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></svg><span class="lbl">Nouveau</span></button>
    <button id="auto" aria-pressed="false" title="Méditer (M)"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 7.6 5.4"/></svg><span class="lbl">Méditer</span></button>
    <button id="snd" aria-pressed="true" title="Son"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path id="sndw" d="M16 9c1.5 1.5 1.5 4.5 0 6M18.5 6.5c3 3 3 8 0 11"/></svg><span class="lbl">Son</span></button>
  </div>
</div>
<div class="intro" id="intro">
  <div>
    <h1>KevZen</h1>
    <p>Un jardin de sable qui respire. Ratissez, posez des pierres, écoutez le jardin vous répondre.</p>
    <button class="go" id="go">Entrer dans le jardin</button>
    <small>Avec le son, c'est mieux. Casque conseillé.</small>
  </div>
</div>
<script>
{
const TAU=Math.PI*2,C=2,SP=5,AMP=1,RINGS=3;
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const MOODS={
 aube:{name:'Aube',sh:[118,98,118],mid:[226,204,204],li:[255,245,240],glow:'rgba(255,186,200,.6)',gp:[.12,.08],vig:'rgba(70,30,60,.42)',tint:'rgba(200,120,160,.16)',part:'petal',root:293.66,scale:[0,1,5,7,8],sw:'linear-gradient(135deg,#ffe0e4,#b896ab)',bg:'#3a2c33'},
 midi:{name:'Midi',sh:[146,124,92],mid:[233,221,197],li:[255,252,242],glow:'rgba(255,246,214,.55)',gp:[.3,0],vig:'rgba(70,50,20,.32)',tint:'rgba(0,0,0,0)',part:'petal',root:349.23,scale:[0,2,5,7,9],sw:'linear-gradient(135deg,#fff7e4,#d2bb8e)',bg:'#3b3226'},
 soir:{name:'Crépuscule',sh:[92,52,66],mid:[214,156,114],li:[255,220,168],glow:'rgba(255,140,70,.6)',gp:[.92,.04],vig:'rgba(60,18,34,.5)',tint:'rgba(210,90,40,.22)',part:'leaf',root:261.63,scale:[0,3,5,7,10],sw:'linear-gradient(135deg,#ffc388,#83465a)',bg:'#3a2220'},
 nuit:{name:'Nuit',sh:[14,22,40],mid:[72,88,120],li:[190,206,234],glow:'rgba(160,195,255,.4)',gp:[.84,.1],vig:'rgba(0,4,22,.62)',tint:'rgba(24,40,100,.5)',part:'fly',root:220,scale:[0,2,3,7,8],sw:'linear-gradient(135deg,#a7badf,#18223a)',bg:'#121827'}
};
let mood='aube',soundOn=true;
try{const s=JSON.parse(localStorage.getItem('kevzen')||'{}');if(MOODS[s.mood])mood=s.mood;if(s.sound===false)soundOn=false}catch(e){}
const save=()=>{try{localStorage.setItem('kevzen',JSON.stringify({mood,sound:soundOn}))}catch(e){}};
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- sable ---------- */
let vw=0,vh=0,dpr=1,W=0,H=0,hm,mask,ringT,grain,img,sand,sctx,dirty=null,stones=[],undoS=[],grow=[],sweep=null;
function markDirty(x0,y0,x1,y1){x0=Math.max(0,x0|0);y0=Math.max(0,y0|0);x1=Math.min(W-1,Math.ceil(x1));y1=Math.min(H-1,Math.ceil(y1));if(x1<x0||y1<y0)return;
 if(!dirty)dirty=[x0,y0,x1,y1];else{dirty[0]=Math.min(dirty[0],x0);dirty[1]=Math.min(dirty[1],y0);dirty[2]=Math.max(dirty[2],x1);dirty[3]=Math.max(dirty[3],y1)}}
const markAll=()=>markDirty(0,0,W,H);
function resize(){
 const nvw=innerWidth,nvh=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
 cv.width=Math.round(nvw*dpr);cv.height=Math.round(nvh*dpr);
 const nW=Math.ceil(nvw/C)+1,nH=Math.ceil(nvh/C)+1;
 if(nW===W&&nH===H){vw=nvw;vh=nvh;return}
 const nh=new Float32Array(nW*nH);
 for(let y=0;y<nH;y++){const v=-Math.cos(y*TAU/SP)*AMP;for(let x=0;x<nW;x++)nh[y*nW+x]=v}
 if(hm)for(let y=0;y<Math.min(H,nH);y++)for(let x=0;x<Math.min(W,nW);x++)nh[y*nW+x]=hm[y*W+x];
 W=nW;H=nH;vw=nvw;vh=nvh;hm=nh;
 grain=new Float32Array(W*H);const r=rng(7);for(let i=0;i<grain.length;i++)grain[i]=r()-.5;
 sand=document.createElement('canvas');sand.width=W;sand.height=H;sctx=sand.getContext('2d');img=sctx.createImageData(W,H);
 undoS=[];buildMask();markAll();
}
function shade(x0,y0,x1,y1){
 const m=MOODS[mood],d=img.data,sh=m.sh,mi=m.mid,li=m.li;
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
  const i=y*W+x;
  const nx=hm[x>0?i-1:i]-hm[x<W-1?i+1:i],ny=hm[y>0?i-W:i]-hm[y<H-1?i+W:i];
  let t=.56+(nx*-.62+ny*-.74)*.2+hm[i]*.05+grain[i]*.09;t=clamp(t,0,1);
  let a,b,u;if(t<.5){a=sh;b=mi;u=t*2}else{a=mi;b=li;u=(t-.5)*2}
  const o=i*4;d[o]=a[0]+(b[0]-a[0])*u;d[o+1]=a[1]+(b[1]-a[1])*u;d[o+2]=a[2]+(b[2]-a[2])*u;d[o+3]=255;
 }
 sctx.putImageData(img,0,0,x0,y0,x1-x0+1,y1-y0+1);
}
let tines=5;
function rakeSeg(ax,ay,bx,by){
 const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy);if(len<.01)return;
 const ux=dx/len,uy=dy/len,half=tines*SP/2,steps=Math.ceil(len/1.5),sl=len/steps,r=half+2;
 for(let s=0;s<steps;s++){
  const px=ax+dx*s/steps,py=ay+dy*s/steps,qx=px+ux*sl,qy=py+uy*sl;
  const x0=Math.max(0,Math.floor(Math.min(px,qx)-r)),x1=Math.min(W-1,Math.ceil(Math.max(px,qx)+r));
  const y0=Math.max(0,Math.floor(Math.min(py,qy)-r)),y1=Math.min(H-1,Math.ceil(Math.max(py,qy)+r));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
   const i=y*W+x;if(mask[i])continue;
   const rx=x-px,ry=y-py,t=rx*ux+ry*uy;if(t<-1||t>sl+1)continue;
   const d=-rx*uy+ry*ux,ad=Math.abs(d);if(ad>half)continue;
   const w=Math.min(1,(half-ad)/(SP*.55));
   const tg=-Math.cos((d+half-SP/2)*TAU/SP)*AMP;
   hm[i]+=(tg-hm[i])*.42*w;
  }
 }
 markDirty(Math.min(ax,bx)-half-3,Math.min(ay,by)-half-3,Math.max(ax,bx)+half+3,Math.max(ay,by)+half+3);
}
function smoothAt(cx,cy,r){
 for(let y=Math.max(0,cy-r|0);y<=Math.min(H-1,cy+r);y++)for(let x=Math.max(0,cx-r|0);x<=Math.min(W-1,cx+r);x++){
  const i=y*W+x;if(mask[i])continue;const d=Math.hypot(x-cx,y-cy);if(d>r)continue;
  const f=1-d/r;hm[i]*=1-.2*f;
 }
 markDirty(cx-r-2,cy-r-2,cx+r+2,cy+r+2);
}

/* ---------- pierres ---------- */
const KINDS=[['#8b867f','#d2cdc4','#3f3c38'],['#57534f','#a29c94','#211f1d'],['#8e7965','#d6c0a6','#43352a'],['#6d7470','#b9c1bb','#2d3330']];
const ringR=s=>(s.r*s.e*1.08+4)/C;
function buildMask(){
 mask=new Uint8Array(W*H);ringT=new Float32Array(W*H);
 for(const s of stones){
  const cx=s.x/C,cy=s.y/C,R=ringR(s),Z=R+RINGS*SP;
  for(let y=Math.max(0,cy-Z|0);y<=Math.min(H-1,cy+Z);y++)for(let x=Math.max(0,cx-Z|0);x<=Math.min(W-1,cx+Z);x++){
   const rr=Math.hypot(x-cx,y-cy);if(rr>Z)continue;const i=y*W+x;
   const v=rr<R?.35:-Math.cos((rr-R)*TAU/SP)*AMP;
   if(!mask[i]||rr<R)ringT[i]=v;mask[i]=1;
  }
 }
}
function makeStone(x,y,r,kind){
 const R=rng(Math.random()*1e9|0);
 const s={x,y,r,e:1+R()*.3,rot:R()*Math.PI,kind:kind??(R()*KINDS.length|0),moss:R()<.55,seed:R()*1e9|0,pts:[]};
 const n=16;for(let k=0;k<n;k++){const a=k/n*TAU,rad=r*(1+.1*Math.sin(a*2+s.seed)+.08*(R()-.5));let px=Math.cos(a)*rad*s.e,py=Math.sin(a)*rad;
  s.pts.push([px*Math.cos(s.rot)-py*Math.sin(s.rot),px*Math.sin(s.rot)+py*Math.cos(s.rot)])}
 renderStone(s);return s;
}
function renderStone(s){
 const m=MOODS[mood],k=KINDS[s.kind],R=s.r*s.e*1.15,pad=s.r*.9+10,half=R+pad,size=Math.ceil(half*2*dpr);
 const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');g.scale(dpr,dpr);g.translate(half,half);
 const p=new Path2D(),P=s.pts,n=P.length;
 p.moveTo((P[0][0]+P[n-1][0])/2,(P[0][1]+P[n-1][1])/2);
 for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n];p.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}
 g.save();g.shadowColor='rgba(25,12,0,.55)';g.shadowBlur=s.r*.55*dpr;g.shadowOffsetX=s.r*.22*dpr;g.shadowOffsetY=s.r*.3*dpr;g.fillStyle=k[0];g.fill(p);g.restore();
 g.save();g.clip(p);
 const gr=g.createRadialGradient(-s.r*.4,-s.r*.45,s.r*.05,0,0,R*1.05);gr.addColorStop(0,k[1]);gr.addColorStop(.5,k[0]);gr.addColorStop(1,k[2]);
 g.fillStyle=gr;g.fillRect(-half,-half,half*2,half*2);
 const r=rng(s.seed);
 for(let i=0;i<s.r*9;i++){const a=r()*TAU,d=Math.sqrt(r())*R;g.fillStyle=r()<.5?'rgba(255,255,255,.13)':'rgba(0,0,0,.16)';g.beginPath();g.arc(Math.cos(a)*d,Math.sin(a)*d,r()*1.3+.3,0,TAU);g.fill()}
 for(let i=0;i<3;i++){g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=.8;g.beginPath();const a=r()*TAU;g.moveTo(Math.cos(a)*R,Math.sin(a)*R);g.quadraticCurveTo(r()*s.r-s.r/2,r()*s.r-s.r/2,-Math.cos(a)*R,-Math.sin(a)*R);g.stroke()}
 if(s.moss){for(let i=0;i<7;i++){const mx=-s.r*.35+(r()-.5)*s.r*.9,my=-s.r*.4+(r()-.5)*s.r*.7,mr=s.r*(.18+r()*.28);
  const mg=g.createRadialGradient(mx,my,0,mx,my,mr);mg.addColorStop(0,`rgba(${96+r()*30|0},${128+r()*30|0},${58+r()*20|0},.85)`);mg.addColorStop(1,'rgba(80,110,50,0)');g.fillStyle=mg;g.fillRect(mx-mr,my-mr,mr*2,mr*2)}
  for(let i=0;i<60;i++){g.fillStyle=`rgba(${150+r()*50|0},${180+r()*40|0},90,.35)`;const a=r()*TAU,d=r()*s.r*.5;g.fillRect(-s.r*.35+Math.cos(a)*d,-s.r*.4+Math.sin(a)*d,1,1)}}
 const lg=g.createLinearGradient(-R,-R,R,R);lg.addColorStop(0,'rgba(255,255,255,.28)');lg.addColorStop(.5,'rgba(0,0,0,0)');lg.addColorStop(1,'rgba(0,0,0,.45)');
 g.lineWidth=s.r*.22;g.strokeStyle=lg;g.stroke(p);
 g.globalCompositeOperation='source-atop';g.fillStyle=m.tint;g.fillRect(-half,-half,half*2,half*2);
 g.restore();s.cv=c;s.half=half;
}
function placeStone(x,y,r,silent){
 const s=makeStone(x,y,r);stones.push(s);buildMask();grow.push({s,p:0});
 if(!silent)bell(MOODS[mood].root/2*(r>34?.75:1),x);return s;
}
function stoneAt(x,y){for(let i=stones.length-1;i>=0;i--){const s=stones[i];if(Math.hypot(x-s.x,y-s.y)<s.r*s.e)return i}return -1}
function removeStone(i){
 const s=stones.splice(i,1)[0];const cx=s.x/C,cy=s.y/C,Z=ringR(s)+RINGS*SP;buildMask();
 for(let y=Math.max(0,cy-Z|0);y<=Math.min(H-1,cy+Z);y++)for(let x=Math.max(0,cx-Z|0);x<=Math.min(W-1,cx+Z);x++){const i=y*W+x;if(!mask[i]&&Math.hypot(x-cx,y-cy)<=Z)hm[i]*=.25}
 markDirty(cx-Z-2,cy-Z-2,cx+Z+2,cy+Z+2);pluck(MOODS[mood].root/2,.12,s.x/vw*1.4-.7);
}
function stepGrow(dt){
 for(let j=grow.length-1;j>=0;j--){const q=grow[j],s=q.s;q.p=Math.min(1,q.p+.035*dt);
  if(!stones.includes(s)){grow.splice(j,1);continue}
  const cx=s.x/C,cy=s.y/C,Z=ringR(s)+RINGS*SP,lim=Z*q.p;
  for(let y=Math.max(0,cy-lim|0);y<=Math.min(H-1,cy+lim);y++)for(let x=Math.max(0,cx-lim|0);x<=Math.min(W-1,cx+lim);x++){
   const i=y*W+x;if(mask[i]&&Math.hypot(x-cx,y-cy)<=lim)hm[i]+=(ringT[i]-hm[i])*.5}
  markDirty(cx-lim-2,cy-lim-2,cx+lim+2,cy+lim+2);if(q.p>=1)grow.splice(j,1)}
}
function compose(){
 stones=[];const n=[3,5,5,7][Math.random()*4|0],R=Math.random,m=Math.min(vw,vh);
 const big=clamp(m*.07,26,54);let tries=0;
 while(stones.length<n&&tries++<400){
  const first=!stones.length,r=first?big:big*(.35+R()*.55);
  const x=vw*(.12+R()*.76),y=vh*(.16+R()*.6);
  if(stones.some(s=>Math.hypot(s.x-x,s.y-y)<(s.r+r)*1.4+(R()<.5?RINGS*SP*C*2:0)))continue;
